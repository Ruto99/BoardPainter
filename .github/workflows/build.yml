name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['main', 'claude/**']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
            files: |
              dist/*.exe
          - os: macos-latest
            cmd: npm run dist:mac
            files: |
              dist/*.dmg
          - os: ubuntu-latest
            cmd: npm run dist:linux
            files: |
              dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BoardPainter-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
